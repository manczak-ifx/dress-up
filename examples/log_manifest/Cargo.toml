[package]
name = "example-suit-manifest-logger"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dress-up = { path = "../.." }
clap = { version = "4.5.51", features = ["derive"] }
uuid = { version = "1.18.1", default-features = false }
generic-array = { version = "1.3.5", features = ["const-default"] }
minicbor = { version = "2.2.1", default-features = false, features = ["half"] }
sha2 = { version = "0.10.9", default-features = false }
cose-rust = "0.1.8"
cose-nostd = { git = "https://codeberg.org/COLORADIO-Project/cose-nostd.git", version = "0.1.0", features = [
	"p-256",
	"sign1",
	"verify",
] }
openssl = "0.10.77"

[build-dependencies]
openssl = "0.10.77"
